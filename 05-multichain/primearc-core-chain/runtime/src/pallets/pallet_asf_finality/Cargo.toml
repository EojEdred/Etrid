[package]
name = "pallet-asf-finality"
version = "0.1.0"
edition = "2021"
description = "ASF Finality pallet for ËTRID blockchain"
license = "Apache-2.0"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6", default-features = false, features = ["derive"] }
scale-info = { version = "2.10", default-features = false, features = ["derive"] }
frame-support = { version = "29.0.0", default-features = false }
frame-system = { version = "29.0.0", default-features = false }
sp-runtime = { version = "32.0.0", default-features = false }
sp-std = { version = "14.0.0", default-features = false }
sp-core = { version = "29.0.0", default-features = false }
log = { version = "0.4", default-features = false }

[dev-dependencies]
sp-io = { version = "31.0.0" }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-core/std",
]
runtime-benchmarks = []
try-runtime = ["frame-support/try-runtime"]
