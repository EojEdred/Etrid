[package]
name = "primearc-core-node"
version = "0.1.0"
authors = ["Ëtrid Team"]
edition = "2021"
license = "Apache-2.0"
build = "build.rs"
description = "Primearc Core Chain validator node for Ëtrid multichain protocol"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "primearc_core_node"
path = "src/lib.rs"

[[bin]]
name = "primearc-core-node"
path = "src/main.rs"

[dependencies]
# CLI dependencies
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonrpsee = { version = "0.24.3", features = ["server"] }

# Substrate Client
sc-cli = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-executor = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-service = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-telemetry = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-transaction-pool-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-rpc-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-basic-authorship = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-offchain = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-network = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-network-sync = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# Substrate Primitives
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-timestamp = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-keyring = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-blockchain = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-offchain = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-session = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-genesis-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# Frame
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
pallet-transaction-payment = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# RPC
substrate-frame-rpc-system = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
pallet-transaction-payment-rpc = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-rpc = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# Local dependencies (will create these)
primearc-core-runtime = { path = "../runtime" }

# ASF Consensus Modules (ËTRID custom consensus)
asf-algorithm = { path = "../../../09-consensus/asf-algorithm" }
block-production = { path = "../../../09-consensus/block-production" }
finality-gadget = { package = "etrid-finality-gadget", path = "../../../09-consensus/finality-gadget" }
validator-management = { path = "../../../09-consensus/validator-management" }
pallet-validator-committee-runtime-api = { path = "../../../11-peer-roles/pallet-validator-committee/runtime-api" }
substrate-prometheus-endpoint = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# Governance RPC (Consensus Day integration)
governance-runtime-api = { path = "../../../12-consensus-day/governance-runtime-api" }

# ÉTRID P2P Networking
detrp2p = { workspace = true }
etrid-protocol = { path = "../../../01-detr-p2p/etrid-protocol" }
bincode = "1.3"
etrid-p2p-dpeers = { path = "../../../01-detr-p2p/dpeers" }
detrp2p-peerstored = { path = "../../../01-detr-p2p/stored" }

# Additional dependencies for ASF integration
async-trait = "0.1"
futures-timer = "3.0"
codec = { package = "parity-scale-codec", version = "3.6.1", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "sync", "time"] }
hex = "0.4"

# Additional Substrate dependencies for ASF consensus
sp-consensus = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", optional = true }
frame-benchmarking-cli = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", optional = true }

[build-dependencies]
substrate-build-script-utils = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

[features]
default = []
runtime-benchmarks = [
    "primearc-core-runtime/runtime-benchmarks",
    "frame-benchmarking",
    "frame-benchmarking-cli",
]
