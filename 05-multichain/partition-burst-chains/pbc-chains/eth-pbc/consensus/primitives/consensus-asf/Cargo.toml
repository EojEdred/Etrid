[package]
name = "sp-consensus-asf-pbc"
version = "0.1.0"
edition = "2021"
authors = ["Ëtrid Foundation"]
description = "Primitives for ASF (Adaptive Stake-weighted Finality) consensus - PBC variant"
license = "Apache-2.0"

[dependencies]
# Substrate primitives - explicit stable2506
sp-api = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-std = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-runtime = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-inherents = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-consensus-slots = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-timestamp = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# Codec
codec = { package = "parity-scale-codec", version = "3.7.0", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.3", default-features = false, features = ["derive"] }

# Async (std only)
async-trait = { version = "0.1", default-features = false, optional = true }

[features]
default = ["std"]
sdk2506 = []  # Feature flag only - signals to use with stable2506 collators
std = [
    "codec/std",
    "scale-info/std",
    "sp-api/std",
    "sp-std/std",
    "sp-runtime/std",
    "sp-inherents/std",
    "sp-consensus-slots/std",
    "sp-timestamp/std",
    "async-trait",
]
