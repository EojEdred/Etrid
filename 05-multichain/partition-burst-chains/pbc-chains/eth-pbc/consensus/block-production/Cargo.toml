[package]
name = "block-production-pbc"
version = "0.1.0"
edition = "2021"
authors = ["Ëtrid Foundation"]
description = "Block authoring and production for Ëtrid FODDoS ASF consensus"
license = "Apache-2.0"

[dependencies]
# Substrate primitives
sp-core = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-std = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-runtime = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-io = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# Codec
codec = { package = "parity-scale-codec", version = "3.7.0", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.3", default-features = false, features = ["derive"] }

# Serialization
serde = { version = "1.0.208", default-features = false, features = ["derive", "alloc"] }

# Logging
log = { version = "0.4", default-features = false }

# Internal dependencies
asf-algorithm-pbc = { path = "../asf-algorithm", default-features = false }
validator-management-pbc = { path = "../validator-management", default-features = false }

# Async runtime (std only)
futures = { version = "0.3.30", optional = true }
tokio = { version = "1.36", features = ["full"], optional = true }

# Error handling
thiserror = { version = "1.0", optional = true }

# Time utilities (std only)
chrono = { version = "0.4", optional = true }

[dev-dependencies]
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
tokio = { version = "1", features = ["test-util", "macros", "time"] }

[features]
default = ["std"]
std = [
    "sp-core/std",
    "sp-std/std",
    "sp-runtime/std",
    "sp-io/std",
    "codec/std",
    "scale-info/std",
    "serde/std",
    "log/std",
    "asf-algorithm-pbc/std",
    "validator-management-pbc/std",
    "futures",
    "tokio",
    "thiserror",
    "chrono",
]
