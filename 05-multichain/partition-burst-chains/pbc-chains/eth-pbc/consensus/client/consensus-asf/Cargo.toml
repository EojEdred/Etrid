[package]
name = "sc-consensus-asf-pbc"
version = "0.1.0"
edition = "2021"
authors = ["Ëtrid Foundation"]
description = "ASF consensus service for Substrate client - PBC variant"
license = "Apache-2.0"

[dependencies]
# Ëtrid primitives
sp-consensus-asf-pbc = { path = "../../primitives/consensus-asf", default-features = false }

# Ëtrid consensus
pallet-consensus-pbc = { path = "../../pallet", default-features = false }
asf-algorithm-pbc = { path = "../../asf-algorithm", default-features = false }
block-production-pbc = { path = "../../block-production", default-features = false }

# Substrate primitives
sp-api = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-blockchain = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-runtime = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-core = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-consensus = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-consensus-slots = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-inherents = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-timestamp = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-keystore = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-application-crypto = { default-features = false, git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# Substrate client
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-consensus-slots = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sc-telemetry = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
substrate-prometheus-endpoint = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

# Codec
codec = { package = "parity-scale-codec", version = "3.7.0", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.3", default-features = false, features = ["derive"] }

# Async
async-trait = { version = "0.1", default-features = false }
futures = { version = "0.3", default-features = false }
futures-timer = "3.0"

# Logging
log = { version = "0.4", default-features = false }

# Utilities
parking_lot = "0.12"
thiserror = "2.0"
derive_more = { version = "1.0", features = ["full"] }

# Crypto for AccountId20 derivation
libsecp256k1 = { version = "0.7", default-features = false }

[features]
default = ["std"]
std = [
    "sp-consensus-asf-pbc/std",
    "pallet-consensus-pbc/std",
    "asf-algorithm-pbc/std",
    "block-production-pbc/std",
    "sp-api/std",
    "sp-runtime/std",
    "sp-core/std",
    "sp-inherents/std",
    "sp-timestamp/std",
    "sp-keystore/std",
    "sp-application-crypto/std",
    "codec/std",
    "scale-info/std",
    "libsecp256k1/std",
]
