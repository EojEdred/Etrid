[package]
name = "eth-pbc-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Ëtrid Foundation"]
description = "Ethereum Partition Burst Chain runtime for Ëtrid Multichain"
license = "Apache-2.0"

[dependencies]
# Frontier EVM Support (frontier-stable2506 tag - must match collator to avoid duplicate dependencies)
pallet-evm = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
pallet-ethereum = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
pallet-base-fee = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
pallet-dynamic-fee = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
pallet-evm-chain-id = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
pallet-evm-precompile-simple = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
pallet-evm-precompile-modexp = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
pallet-evm-precompile-sha3fips = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
fp-evm = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
fp-rpc = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false }
fp-self-contained = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false, features = ["serde"] }
fp-account = { git = "https://github.com/polkadot-evm/frontier", tag = "frontier-stable2506", default-features = false, features = ["serde"] }

# EVM primitives
ethereum = { version = "0.18", default-features = false }
evm = { version = "0.41", default-features = false }

# Substrate Core - Use stable2506 explicitly
codec = { package = "parity-scale-codec", version = "3.7.0", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.3", default-features = false, features = ["derive"] }
serde = { version = "1.0.208", default-features = false, features = ["derive", "alloc"] }

# FRAME Dependencies
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
frame-executive = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
frame-system-rpc-runtime-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }

# Substrate Primitives
sp-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-offchain = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-session = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-genesis-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }

# FRAME Pallets
pallet-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
pallet-sudo = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
pallet-timestamp = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
pallet-transaction-payment = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
pallet-insecure-randomness-collective-flip = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
pallet-aura = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }

# Polkadot/Cumulus
polkadot-runtime-common = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
cumulus-pallet-weight-reclaim = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }

# Ëtrid ASF Consensus (use local eth-pbc workspace version with stable2506)
pallet-consensus-pbc = { path = "../consensus/pallet", default-features = false }
sp-consensus-asf-pbc = { path = "../consensus/primitives/consensus-asf", default-features = false }

# Validator Management Components (custom for stable2506 compatibility)
pallet-session = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
validator-committee-pbc = { path = "../consensus/validator-management", default-features = false }
pallet-validator-committee = { path = "../../../../11-peer-roles/pallet-validator-committee", default-features = false }
pallet-validator-rewards = { path = "../../../../11-peer-roles/pallet-validator-rewards", default-features = false }
pallet-etrid-staking = { path = "../../../../11-peer-roles/staking/pallet", default-features = false }
asf-algorithm-pbc = { path = "../consensus/asf-algorithm", default-features = false }

# Shared Bridge Pallets
pallet-bridge-attestation = { path = "../../../../pallets-shared/pallet-bridge-attestation", default-features = false }
pallet-token-messenger = { path = "../../../../pallets-shared/pallet-token-messenger", default-features = false }

[build-dependencies]
substrate-wasm-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "serde/std",
    "frame-support/std",
    "frame-system/std",
    "frame-executive/std",
    "sp-api/std",
    "sp-block-builder/std",
    "sp-core/std",
    "sp-inherents/std",
    "sp-io/std",
    "sp-offchain/std",
    "sp-runtime/std",
    "sp-session/std",
    "sp-std/std",
    "sp-transaction-pool/std",
    "sp-version/std",
    "sp-consensus-grandpa/std",
    "sp-genesis-builder/std",
    "pallet-balances/std",
    "pallet-grandpa/std",
    "pallet-sudo/std",
    "pallet-timestamp/std",
    "pallet-transaction-payment/std",
    "pallet-insecure-randomness-collective-flip/std",
    "pallet-aura/std",
    "sp-consensus-aura/std",
    "sp-consensus-asf-pbc/std",
    "pallet-consensus-pbc/std",
    "polkadot-runtime-common/std",
    "cumulus-pallet-weight-reclaim/std",
    "frame-system-rpc-runtime-api/std",
    "pallet-transaction-payment-rpc-runtime-api/std",

    # Frontier EVM
    "pallet-evm/std",
    "pallet-ethereum/std",
    "pallet-base-fee/std",
    "pallet-dynamic-fee/std",
    "pallet-evm-chain-id/std",
    "pallet-evm-precompile-simple/std",
    "pallet-evm-precompile-modexp/std",
    "pallet-evm-precompile-sha3fips/std",
    "fp-evm/std",
    "fp-rpc/std",
    "fp-self-contained/std",
    "fp-account/std",
    "ethereum/std",
    "evm/std",

    # Validator Management Pallets
    "pallet-session/std",
    "pallet-validator-committee/std",
    "pallet-validator-rewards/std",
    "pallet-etrid-staking/std",
    "asf-algorithm-pbc/std",

    # Shared Bridge Pallets
    "pallet-bridge-attestation/std",
    "pallet-token-messenger/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-consensus-pbc/runtime-benchmarks",
]
