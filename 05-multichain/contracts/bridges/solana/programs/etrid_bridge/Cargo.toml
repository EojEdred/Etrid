[package]
name = "etrid-bridge"
version = "1.0.0"
description = "ETRID Cross-Chain Bridge for Solana with 5-of-9 Director Attestation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "etrid_bridge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.18.0"
