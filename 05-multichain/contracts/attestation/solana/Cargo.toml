[package]
name = "etrid-attester-registry"
version = "1.0.0"
description = "ETRID Attester Registry for Solana - 9 Director attestation system"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "etrid_attester_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[dev-dependencies]
solana-program-test = "1.18"
solana-sdk = "1.18"
tokio = "1.36"
