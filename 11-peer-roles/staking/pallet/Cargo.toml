[package]
name = "pallet-etrid-staking"
version = "0.1.0"
edition = "2021"
authors = ["Ëtrid Foundation"]
description = "Staking & role assignment pallet for Ëtrid peer-roles system"
license = "Apache-2.0"

[dependencies]
# Substrate - align with workspace polkadot-sdk tag
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506", default-features = false }

codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
log = { version = "0.4", default-features = false }

# Serde for serialization
serde = { version = "1.0", features = ["alloc", "derive"], default-features = false }

# Internal Ëtrid dependencies
peer-roles-staking-types = { path = "../types", default-features = false }
pallet-validator-rewards = { path = "../../pallet-validator-rewards", default-features = false }
pallet-treasury-etrid = { path = "../../../10-foundation/pallets/pallet-treasury", default-features = false, package = "pallet-treasury" }

[dev-dependencies]
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2506" }

[features]
default = ["std"]
std = [
    "frame-support/std",
    "frame-system/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-io/std",
    "codec/std",
    "scale-info/std",
    "log/std",
    "serde/std",
    "serde/alloc",
    "peer-roles-staking-types/std",
    "pallet-validator-rewards/std",
    "pallet-treasury-etrid/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
