[package]
name = "detrp2p"
version = "0.1.0"
edition = "2021"
authors = ["Etrid Team"]
description = "DETR P2P - Distributed Encrypted Transport for Etrid Network"
license = "Apache-2.0"

[dependencies]
# Async runtime - explicit versions for standalone builds
tokio = { version = "1.22.0", features = ["full"] }
futures = { version = "0.3.28", default-features = false, features = ["alloc"] }

# Serialization
serde = { version = "1.0.208", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.125", default-features = false, features = ["alloc"] }
bincode = "1.3"

# Cryptography - use Etrid's own aecomms module
ecies = { version = "0.2", default-features = false, features = ["pure"] }
etrid-aecomms = { path = "../aecomms" }

# Utilities
log = { version = "0.4", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1.22.0", features = ["full"] }

[features]
default = ["std"]
std = []
