[package]
name = "detrp2p-peerstored"
version = "0.1.0"
edition = "2021"
authors = ["Etrid Core Team"]
description = "Peer storage and caching module for Etrid P2P network"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
rocksdb = { version = "0.21", optional = true, default-features = false, features = ["snappy"] }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
rocksdb-backend = ["rocksdb"]
[lib]
path = "src/lib.rs"
