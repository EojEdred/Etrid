[package]
name = "pallet-evm"
version = "0.1.0"
edition = "2021"
authors = ["ËTRID Foundation"]
description = "FRAME pallet exposing the ETWasm EVM compatibility adapter"
license = "Apache-2.0"

[package.metadata.docs]
rs = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "serde/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-runtime/std",
    "sp-std/std",
    "frame-support/std",
    "frame-system/std",
    "evm-adapter/std",
    "pallet-etwasm-vm/std",
    "etwasm-gas-metering/std",
    "pallet-timestamp/std"
]

[dependencies]
codec = { workspace = true, default-features = false }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
serde = { workspace = true, default-features = false, features = ["derive"] }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
pallet-timestamp = { workspace = true, default-features = false }
evm-adapter = { path = "../evm-adapter", default-features = false }
pallet-etwasm-vm = { path = "../pallet", default-features = false }
etwasm-gas-metering = { path = "../gas-metering", default-features = false }

[dev-dependencies]
sp-tracing = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2509" }
sp-keystore = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false, features = ["std"] }
frame-support = { workspace = true, features = ["std"] }
frame-system = { workspace = true, features = ["std"] }
sp-version = { workspace = true, default-features = false, features = ["std"] }
